name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install & Build Web Assets
        env:
          VITE_API_BASE_URL: ${{ vars.APP_URL || '' }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android & Build APK
        env:
          CI: 'true'
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Challan Scan" "com.foodoffice.challanscan" --web-dir=dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' "$MANIFEST"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Challan-Scan-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
